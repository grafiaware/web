name: PHP Composer

on:
  push:
    branches: [ "master", "master-vp" ]
  pull_request:
    branches: [ "master", "master-vp" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, intl, gd, zip, pdo_mysql, pdo_sqlite
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php84-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php84-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Unit testy bez DB. Integrační testy potřebují DB s daty (anonymizované dumpy, Z10) — zatím jen lokálně.
    - name: Run unit tests
      run: vendor/bin/phpunit -c tests/phpunit.xml --testsuite unit
