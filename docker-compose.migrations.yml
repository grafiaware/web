# Lokální MySQL pro ověření verzovaných migrací (Build panel).
# PHP/web kontejner záměrně NENÍ — napojte stávající lokální stack na 127.0.0.1:3306.
# Návod: docs/migrace-db-docker.md
#
# Start:  docker compose -f docker-compose.migrations.yml up -d
# Stop:   docker compose -f docker-compose.migrations.yml down
# Reset:  docker compose -f docker-compose.migrations.yml down -v

services:
  mysql:
    image: mysql:8.0
    container_name: grafia-web-mysql-migrations
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Prague
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - grafia_web_mysql_migrations_data:/var/lib/mysql
      - ./docker/migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  grafia_web_mysql_migrations_data:
