; Vývojové PHP (Docker). Ne pro produkci.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = Europe/Prague
display_errors = On
error_reporting = E_ALL
log_errors = On

; PDO MySQL — TCP na 127.0.0.1 (socat → služba db), ne socket.
pdo_mysql.default_socket =
mysqli.default_socket =
