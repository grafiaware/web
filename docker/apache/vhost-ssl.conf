# HTTPS vhost — certifikáty z docker/certs (generate-certs.sh).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    SetEnv WEB_PROJECT_PATH /var/www/html/
    PassEnv WEB_PUBLIC_HOST WEB_PUBLIC_SCHEME WEB_DEV_HOSTS

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/key.pem
    # Root CA pro telefony je v docker/certs/ca.pem (ne v Apache chain)

    # Aplikace často čte HTTPS z těchto hlaviček
    RequestHeader set X-Forwarded-Proto "https" early
    RequestHeader set X-Forwarded-Port "443" early

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/grafia-web-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/grafia-web-ssl-access.log combined
</VirtualHost>
</IfModule>
