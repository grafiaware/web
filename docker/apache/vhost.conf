# HTTP vhost — document root = kořen git repa (bind-mount).
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # ServerName / ServerAlias z entrypointu (ServerAlias mimo VirtualHost Apache odmítá)
    IncludeOptional /etc/apache2/grafia-server-names.inc

    # Absolutní cesta projektu pro index.php (obejde limity PROJECT_PATH na Linuxu — Z11).
    SetEnv WEB_PROJECT_PATH /var/www/html/
    # QR / PDF — z Docker env (compose → .env); PHP čte i soubor .env jako zálohu
    PassEnv WEB_PUBLIC_HOST WEB_PUBLIC_SCHEME WEB_DEV_HOSTS

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/grafia-web-error.log
    CustomLog ${APACHE_LOG_DIR}/grafia-web-access.log combined
</VirtualHost>
